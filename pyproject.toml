[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "braintop"
version = "0.1.0"
description = "Composable 3D topology visualization for embeddings, graphs, and geometric layers"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.20.0",
    "plotly>=5.0.0",
    "networkx>=2.5",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
    "mypy>=0.950",
]

openai = ["openai>=1.0.0"]
sentence-transformers = ["sentence-transformers>=2.0.0"]
llama-cpp = ["llama-cpp-python>=0.2.0"]
examples = ["scipy>=1.7.0"]
static = ["plotly>=6.1.1", "kaleido>=1.0.0"]

[project.urls]
Homepage = "https://github.com/jesusvilela/braintop"
Repository = "https://github.com/jesusvilela/braintop"
Issues = "https://github.com/jesusvilela/braintop/issues"

[project.scripts]
braintop = "braintop.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=braintop --cov-report=term-missing"
